name: Ops

# Start, stop, restart, check or update the hosted game without server access.
# Run by hand: Actions tab > Ops > Run workflow, or `gh workflow run ops.yml -f action=restart`.
# This workflow does nothing itself. The server watches for runs of it (within about a minute) and
# then performs exactly one of these five actions. The run name below is what the server reads.
on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do
        required: true
        type: choice
        options: [status, restart, start, stop, sync]

run-name: Ops ${{ inputs.action }} by ${{ github.actor }}

permissions:
  contents: read

jobs:
  request:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Request recorded
        env:
          ACTION: ${{ inputs.action }}
        run: echo "Requested '$ACTION'. The server picks it up within about a minute. Check https://open-world.taps-holdings.org/__ops/status.json"
